services:
  relay:
    image: node:22-alpine
    container_name: treabo-openai-upstream
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    volumes:
      - ./server.mjs:/app/server.mjs:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - gateway

  caddy:
    image: caddy:2.10-alpine
    container_name: treabo-openai-relay
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /run
    networks:
      - gateway
      - treabo
    depends_on:
      - relay

volumes:
  caddy_data:
  caddy_config:

networks:
  gateway:
  treabo:
    external: true
    name: treabo_md_app
